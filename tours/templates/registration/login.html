{% extends "tours/base.html" %}

{% block title %}Вход в штаб — KRAI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto 0;">
  <div style="text-align: center; margin-bottom: 32px;">
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-magma); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px;">
      [АУТЕНТИФИКАЦИЯ СОТРУДНИКА / ТУРИСТА]
    </div>
    <h1 style="font-family: var(--font-display); font-size: 26px; font-weight: 700;">
      Вход в штаб KRAI
    </h1>
  </div>

  <div style="background: var(--bg-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); padding: 32px;">
    {% if form.errors %}
      <div class="alert alert-danger" style="margin-bottom: 20px;">
        Неверное имя пользователя или пароль.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 20px;">
        <label for="id_username" style="display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">
          Имя пользователя
        </label>
        <input class="krai-input" type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autofocus required>
      </div>

      <div style="margin-bottom: 24px;">
        <label for="id_password" style="display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">
          Пароль
        </label>
        <input class="krai-input" type="password" name="password" id="id_password" required>
      </div>

      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit" class="btn btn-magma" style="width: 100%;">
        Войти в систему
      </button>
    </form>
  </div>
</div>
{% endblock %}
