{% extends "tours/base.html" %}

{% block title %}{{ page_title }} — KRAI{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto;">
  <div style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-magma); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px;">
    [РЕГИСТРАЦИЯ УЧАСТНИКА ЭКСПЕДИЦИИ]
  </div>
  <h1 style="font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-bottom: 24px;">
    {{ page_title }}
  </h1>

  <div style="background: var(--bg-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); padding: 32px;">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "tours/_form_fields.html" %}

      <div style="display: flex; gap: 16px; align-items: center; margin-top: 28px;">
        <button type="submit" class="btn btn-magma">
          Отправить заявку
        </button>
        <a href="{% url 'booking_list' %}" class="btn btn-ghost">
          Отмена
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
